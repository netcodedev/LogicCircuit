[package]
name = "LogicCircuit"
version = "0.1.0"
edition = "2024"

[lib]
name = "logic_circuit"
path = "src/lib.rs"

[workspace]
members = [".", "viz"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
pest = "2.9.6"
pest_derive = "2.9.6"
png = "0.18"
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4"] }
