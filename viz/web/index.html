<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogicCircuit Viewer</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #0f1216; --panel: #161a20; --panel-2: #1c2129; --line: #2a313b;
    --text: #d8dee9; --muted: #7d8794; --accent: #6cb6ff;
    --hi: #3ddc84; --lo: #3b4350; --mix: #e8b339; --unk: #e5534b;
    --node: #1b2028; --node-x: #1e2733; --node-stroke: #3a4452; --io: #232a34;
    --seg-on: #ff4d3d; --seg-off: #2a1614;
    --scroll: #343c47; --scroll-hover: #4a5563;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --line: #dde1e6;
      --text: #1f2328; --muted: #6a737d; --accent: #0969da;
      --hi: #1a9f53; --lo: #c3c9d1; --mix: #c08a0a; --unk: #cf222e;
      --node: #ffffff; --node-x: #f1f6fd; --node-stroke: #b8c0ca; --io: #eef0f3;
      --scroll: #c9cfd7; --scroll-hover: #aab2bd;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-hover); }
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: grid;
         grid-template-columns: var(--side-w, 260px) 5px minmax(0, 1fr); grid-template-rows: 44px 1fr; overflow: hidden; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; padding: 0 14px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  #crumbs { display: flex; gap: 4px; align-items: center; color: var(--muted); flex: 1; overflow: hidden; white-space: nowrap; }
  #crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #crumbs a:hover { text-decoration: underline; }
  #crumbs .type { color: var(--muted); font-size: 11px; }
  button { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
  aside section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  #filter { width: 100%; padding: 5px 8px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #list { max-height: 34vh; overflow: auto; margin-top: 6px; }
  #list div { padding: 3px 6px; border-radius: 4px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px; }
  #list div:hover { background: var(--panel-2); }
  #list div.sel { background: var(--accent); color: #fff; }
  #list div { display: flex; justify-content: space-between; gap: 8px; }
  #list .count { color: var(--muted); font-size: 11px; }
  #list div.sel .count { color: #fff; opacity: .8; }
  .io-row { margin: 6px 0; font-family: ui-monospace, monospace; font-size: 12px; }
  .io-head { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
  .bits { display: flex; gap: 2px; flex-wrap: wrap; }
  .bit.nib { margin-left: 5px; }
  .bit { width: 14px; height: 18px; border-radius: 3px; border: 1px solid var(--line); background: var(--lo);
         font-size: 10px; display: grid; place-items: center; cursor: pointer; user-select: none; color: var(--text); }
  .bit.on { background: var(--hi); color: #04130a; border-color: var(--hi); }
  .bit.ro { cursor: default; }
  .val { color: var(--muted); min-width: 34px; text-align: right; }
  #controls { display: flex; gap: 6px; flex-wrap: wrap; }
  #workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #main { position: relative; overflow: hidden; flex: 1; min-height: 100px; }
  .splitter { background: var(--line); transition: background .12s; touch-action: none; }
  .splitter:hover, .splitter.active { background: var(--accent); }
  .splitter.vertical { cursor: col-resize; }
  .splitter.horizontal { cursor: row-resize; height: 5px; flex: none; }
  body.resizing { user-select: none; }
  body.resizing.col { cursor: col-resize; } body.resizing.row { cursor: row-resize; }
  #program-panel { height: var(--prog-h, 260px); flex: none; display: flex; flex-direction: column; background: var(--panel); min-height: 0; }
  .prog-bar { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .prog-bar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 6px 0 0; font-weight: 600; }
  .prog-bar select { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .prog-bar button:disabled { opacity: .45; cursor: default; }
  .hz { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
  .hz input { width: 76px; font: 12px ui-monospace, monospace; text-align: right; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .hz input:focus { outline: none; border-color: var(--accent); }
  #timer { font: 12px ui-monospace, monospace; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
  .prog-bar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .prog-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 34%); gap: 10px; padding: 10px 12px; }
  .prog-editor { display: flex; flex-direction: column; min-height: 0; }
  svg#canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  svg#canvas.drag { cursor: grabbing; }
  #status { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
  #hint { position: absolute; right: 12px; top: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
  .node rect.body { fill: var(--node); stroke: var(--node-stroke); stroke-width: 1; }
  .node.expandable rect.body { fill: var(--node-x); cursor: zoom-in; }
  .node.expandable:hover rect.body { stroke: var(--accent); stroke-width: 1.5; }
  .node .title { font-weight: 600; font-size: 12px; fill: var(--text); }
  .node .type { font-size: 10px; fill: var(--muted); }
  .node .plabel { font-size: 10px; fill: var(--muted); font-family: ui-monospace, monospace; }
  .io rect.body { fill: var(--io); stroke: var(--node-stroke); }
  .io.settable { cursor: pointer; }
  .io.settable:hover rect.body { stroke: var(--accent); }
  .io text { font-family: ui-monospace, monospace; font-size: 11px; fill: var(--text); }
  .port { stroke: none; }
  .s0 { fill: var(--lo); } .s1 { fill: var(--hi); } .sm { fill: var(--mix); } .s2 { fill: var(--unk); }
  .edge { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
  .edge.bus { stroke-width: 3.5; }
  .edge.e0 { stroke: var(--lo); } .edge.e1 { stroke: var(--hi); } .edge.em { stroke: var(--mix); } .edge.e2 { stroke: var(--unk); stroke-dasharray: 4 3; }
  .edge:hover { stroke-width: 4; }
  .edge.bus:hover { stroke-width: 6; }
  .elabel { font-family: ui-monospace, monospace; font-size: 10px; fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .net circle { fill: var(--node-stroke); }
  .gate { color: var(--lo); }
  .gate.s1 { color: var(--hi); }
  .gate.s2 { color: var(--unk); }
  .cmos rect.body { fill: var(--node); stroke: var(--node-stroke); }
  .cmos .rail { stroke: var(--muted); stroke-width: 1.5; }
  .cmos .rail-label { font-size: 8px; fill: var(--muted); }
  .cmos .channel-wire { fill: none; stroke: var(--node-stroke); stroke-width: 1; }
  .cmos .gate-wire { fill: none; stroke-width: 0.8; stroke-dasharray: 2 1.5; }
  .cmos .gate-wire.s0 { stroke: var(--lo); } .cmos .gate-wire.s1 { stroke: var(--hi); }
  .cmos .out-node { fill: none; stroke-width: 2; }
  .cmos .out-node.s0 { stroke: var(--lo); } .cmos .out-node.s1 { stroke: var(--hi); } .cmos .out-node.s2 { stroke: var(--unk); }
  .cmos .bubble { fill: none; stroke: var(--muted); stroke-width: 0.8; }
  /* conducting: NMOS when its gate is 1, PMOS when its gate is 0 */
  .tr { stroke: var(--node-stroke); stroke-width: 0.6; }
  .tr.n1, .tr.p0 { fill: var(--hi); }
  .tr.n0, .tr.p1 { fill: var(--lo); }
  .tr.n2, .tr.p2 { fill: var(--unk); }
  .flat-box rect.body { fill: var(--node); stroke: var(--node-stroke); }
  .flat-box .type { font-size: 10px; fill: var(--text); }
  .export-row { display: flex; gap: 6px; margin-top: 10px; }
  .export-row select { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .view-mode select { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
  /* Constant 1px wires at any zoom: thousands of nets otherwise merge into a solid mass. */
  .edge.flat-net { stroke-width: 1; vector-effect: non-scaling-stroke; }
  .edge.flat-net:hover { stroke-width: 3; }
  .flat-io text { font-size: 10px; }
  .tapbar { fill: var(--muted); }
  .bitlabel { font-size: 9px; fill: var(--muted); font-family: ui-monospace, monospace; }
  .junction { stroke: none; }
  .toggle { display: flex; align-items: center; gap: 6px; margin-top: 10px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); margin: 0; }
  .stripe-bg { fill: none; stroke: var(--bg); stroke-linejoin: miter; }
  .stripe { fill: none; stroke-linejoin: miter; stroke-linecap: butt; }
  .stripe.e0 { stroke: var(--lo); } .stripe.e1 { stroke: var(--hi); } .stripe.e2 { stroke: var(--unk); }
  .striped:hover .stripe-bg { stroke: var(--accent); }
  .stripe-dot { fill: var(--muted); }
  #chip3d { position: absolute; inset: 0; }
  #chip3d canvas { display: block; }
  #chip-message { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; line-height: 1.8; color: var(--text); max-width: 460px; }
  #chip-message code { font: 12px ui-monospace, monospace; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
  #chip-metrics .kv { display: flex; justify-content: space-between; font: 12px ui-monospace, monospace; margin: 2px 0; }
  #chip-metrics .kv span:first-child { color: var(--muted); }
  .slider { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 6px; margin: 6px 0; font-size: 12px; color: var(--muted); }
  .slider input { width: 100%; accent-color: var(--accent); }
  #chip-layers { margin-top: 8px; display: grid; gap: 2px; }
  .layer-row { display: grid; grid-template-columns: 16px 12px 1fr auto; align-items: center; gap: 6px; font: 12px ui-monospace, monospace; cursor: pointer; }
  .layer-row input { margin: 0; accent-color: var(--accent); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .layer-kind { color: var(--muted); font-size: 10px; }
  .chip-hint { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.5; }
  .seg { fill: var(--seg-off); transition: fill .08s; }
  .seg.on { fill: var(--seg-on); filter: drop-shadow(0 0 3px var(--seg-on)); }
  #display { width: 100%; height: 96px; background: #07090b; border-radius: 8px; padding: 6px; display: block; }
  #source { width: 100%; flex: 1; min-height: 0; resize: none; font: 12px/1.45 ui-monospace, monospace; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; tab-size: 8; }
  .val-edit { width: 64px; font: 12px ui-monospace, monospace; text-align: right; background: var(--panel-2); color: var(--text); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
  .val-edit.bad { border-color: var(--unk); }
  #asm-error { color: var(--unk); font-size: 12px; margin-top: 4px; }
  #prog-status { color: var(--muted); font-size: 12px; margin-left: 8px; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  #listing { min-height: 0; overflow: auto; font: 12px/1.5 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 6px; }
  .lrow { display: grid; grid-template-columns: 24px 40px 1fr; gap: 6px; padding: 0 6px; white-space: nowrap; }
  .lrow .addr, .lrow .word { color: var(--muted); }
  .lrow.cur { background: var(--accent); color: #fff; }
  .lrow.cur span { color: #fff; }
  .net text { font-size: 10px; fill: var(--muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>LogicCircuit</h1>
  <nav id="crumbs"></nav>
  <button id="fit" title="Ansicht einpassen (F)">Einpassen</button>
</header>
<aside>
  <section>
    <h2>Schaltung</h2>
    <input id="filter" placeholder="Filtern…" autocomplete="off">
    <div id="list"></div>
  </section>
  <section>
    <h2>Simulation</h2>
    <div id="controls">
      <button id="pulse" class="primary" hidden>Takt ↑↓</button>
      <button id="reset">Neu bauen</button>
    </div>
    <label class="toggle"><input type="checkbox" id="stripes"> Busse als Bit-Streifen</label>
    <div class="export-row">
      <select id="export-cells" title="Zellbibliothek">
        <option value="sky130">sky130</option>
        <option value="generic">generisch</option>
      </select>
      <button id="export-verilog" title="Die aktuelle Ebene als Gatter-Netzliste herunterladen (Stufe: NANDs in der NAND-Ansicht, sonst Basis-Blöcke)">Verilog ↓</button>
    </div>
    <label class="toggle view-mode" title="Wie weit die aktuelle Ebene aufgelöst wird">Ansicht
      <select id="viewmode">
        <option value="parts">Bauteile</option>
        <option value="basic">Basis-Blöcke</option>
        <option value="nand">Nur NANDs</option>
        <option value="cmos">Transistoren</option>
        <option value="chip">Chip 3D</option>
      </select>
    </label>
  </section>
  <section id="chip-section" hidden>
    <h2>Chip</h2>
    <div id="chip-metrics"></div>
    <label class="slider">Explode <input type="range" id="chip-explode" min="0" max="20" step="0.5" value="0"></label>
    <label class="slider">Z-Überhöhung <input type="range" id="chip-zscale" min="1" max="40" step="1" value="5"></label>
    <label class="slider">Schnitt <input type="range" id="chip-cut" min="0" max="1" step="0.01" value="1"></label>
    <label class="toggle"><input type="checkbox" id="chip-power"> Power-Grid (VDD/VSS)</label>
    <div class="export-row" title="Ohne OpenROAD im Browser platzieren und verdrahten (eigener Router)">
      <select id="own-layers">
        <option value="2">2 Lagen</option><option value="3" selected>3 Lagen</option>
        <option value="4">4 Lagen</option><option value="5">5 Lagen</option>
      </select>
      <button id="own-route">Eigener Router</button>
    </div>
    <div id="chip-layers"></div>
    <div class="chip-hint">Klick auf Leitung: Netz hervorheben · Esc: zurück · F: einpassen · layout.bin hierher ziehen</div>
  </section>
  <section id="display-section" hidden><h2>Anzeige</h2><svg id="display"></svg></section>
  <section><h2>Eingänge</h2><div id="inputs"></div></section>
  <section><h2>Ausgänge</h2><div id="outputs"></div></section>
</aside>
<div class="splitter vertical" id="side-split" title="Ziehen, um die Breite zu ändern"></div>
<div id="workspace">
  <div id="main">
    <svg id="canvas">
      <defs>
        <!-- Gate symbols for the flat views, 36x24, output at the right edge.
             Colour comes from the use element's 'color'. -->
        <symbol id="sym-and" viewBox="0 0 36 24" overflow="visible">
          <path d="M1,1 H15 A11,11 0 0 1 15,23 H1 Z" style="fill: var(--node); stroke: currentColor; stroke-width: 1.5"/>
          <line x1="26" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="sym-nand" viewBox="0 0 36 24" overflow="visible">
          <path d="M1,1 H15 A11,11 0 0 1 15,23 H1 Z" style="fill: var(--node); stroke: currentColor; stroke-width: 1.5"/>
          <circle cx="29.5" cy="12" r="3.5" fill="currentColor"/>
          <line x1="33" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="sym-or" viewBox="0 0 36 24" overflow="visible">
          <path d="M1,1 Q16,1 26,12 Q16,23 1,23 Q7,12 1,1 Z" style="fill: var(--node); stroke: currentColor; stroke-width: 1.5"/>
          <line x1="26" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="sym-nor" viewBox="0 0 36 24" overflow="visible">
          <path d="M1,1 Q16,1 26,12 Q16,23 1,23 Q7,12 1,1 Z" style="fill: var(--node); stroke: currentColor; stroke-width: 1.5"/>
          <circle cx="29.5" cy="12" r="3.5" fill="currentColor"/>
          <line x1="33" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="sym-xor" viewBox="0 0 36 24" overflow="visible">
          <path d="M5,1 Q18,1 28,12 Q18,23 5,23 Q11,12 5,1 Z" style="fill: var(--node); stroke: currentColor; stroke-width: 1.5"/>
          <path d="M1,1 Q7,12 1,23" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <line x1="28" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="sym-xnor" viewBox="0 0 36 24" overflow="visible">
          <path d="M5,1 Q16,1 25,12 Q16,23 5,23 Q11,12 5,1 Z" style="fill: var(--node); stroke: currentColor; stroke-width: 1.5"/>
          <path d="M1,1 Q7,12 1,23" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="29" cy="12" r="3.5" fill="currentColor"/>
          <line x1="32.5" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
        <symbol id="sym-not" viewBox="0 0 36 24" overflow="visible">
          <path d="M1,2 L24,12 L1,22 Z" style="fill: var(--node); stroke: currentColor; stroke-width: 1.5"/>
          <circle cx="28" cy="12" r="3.5" fill="currentColor"/>
          <line x1="31.5" y1="12" x2="36" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
      </defs>
      <g id="viewport"></g>
    </svg>
    <div id="chip3d" hidden></div>
    <div id="chip-message" hidden></div>
    <div id="status">Lade…</div>
    <div id="hint">Doppelklick auf Bauteil: hineinzoomen · Mausrad: Zoom · Ziehen: verschieben</div>
  </div>
  <div class="splitter horizontal" id="prog-split" title="Ziehen, um die Höhe zu ändern" hidden></div>
  <section id="program-panel" hidden>
    <div class="prog-bar">
      <h2>Programm</h2>
      <select id="examples" title="Beispielprogramm laden"></select>
      <button id="load" title="Assemblieren, CPU zurücksetzen und Programm laden">Laden</button>
      <span class="sep"></span>
      <button id="step">Schritt</button>
      <button id="run" class="primary">▶ Start</button>
      <label class="hz" title="Takt in Befehlen pro Sekunde">
        <input id="speed" type="number" min="0.1" max="100000" step="any" value="4"> Hz
      </label>
      <span id="timer" title="Laufzeit (ohne Pausen), ausgeführte Befehle und tatsächlich erreichter Durchschnittstakt seit dem Laden"></span>
      <span id="prog-status"></span>
    </div>
    <div class="prog-body">
      <div class="prog-editor">
        <textarea id="source" spellcheck="false" wrap="off" placeholder="; Assembler oder .word 0x…"></textarea>
        <div id="asm-error" hidden></div>
      </div>
      <div id="listing"></div>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
